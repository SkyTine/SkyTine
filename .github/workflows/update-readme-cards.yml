name: Update README cards

on:
  schedule:
    # Runs every day at 08:00 China Standard Time (00:00 UTC).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=false&hide_rank=true&include_all_commits=true&text_bold=false&title_color=0969da&text_color=57606a&border_color=d0d7de&bg_color=ffffff&border_radius=12&card_width=400
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&title_color=0969da&text_color=57606a&border_color=d0d7de&bg_color=ffffff&border_radius=12&card_width=400
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Apply custom language palette
        run: |
          sed -i \
            -e 's/#b07219/#8250df/g' \
            -e 's/#3572A5/#0969da/g' \
            -e 's/#f1e05a/#1b7c83/g' \
            profile/top-langs.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README cards"
          git push
